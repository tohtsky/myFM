name: Doctest
on: [push]
jobs:
  test_readme_and_sphinx_docs:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build myfm
        run: |
          pip install --upgrade pip scikit-build setuptools-scm nanobind
          pip install .
          curl http://files.grouplens.org/datasets/movielens/ml-100k.zip -o ~/.ml-100k.zip
      - name: install pytest
        run: |
          pip install pytest phmdoctest sphinx==4.4.0 sphinx_rtd_theme scikit-learn
      - name: Test Readme.md
        run: |
          GEN_TEST_FILE=phmdoctest_out.py
          phmdoctest README.md --outfile "$GEN_TEST_FILE"
          pytest "$GEN_TEST_FILE"
          rm "$GEN_TEST_FILE"
      - name: Run sphinx doctest
        run: |
          cd doc
          make doctest
